 Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Episode idea</text><text x="26" y="307" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#000">I2</text><text x="46" y="307" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Guest availability</text><text x="418" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C1</text><text x="438" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Editorial calendar</text><text x="553" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C2</text><text x="573" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Style guide</text><text x="655" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#000">C3</text><text x="675" y="50" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Platform</text><text x="675" y="64" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#000">specifications</text><text x="423" y="500" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="bold" fill="#000">M1</text><text x="443" y="500" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#000">Production team</text><text x="553" y="500" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-